name: Uppdatera kartan

on:
  schedule:
    - cron: "20 2,8,14,20 * * *"   # fyra gånger per dygn (UTC)
  workflow_dispatch:
    inputs:
      mask:
        description: "Bygg om land/vatten-masken (behövs bara första gången eller om området ändrats)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kartan
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installera paket
        run: pip install copernicusmarine numpy shapely pillow

      - name: Bygg land/vatten-mask
        if: ${{ inputs.mask || hashFiles('mask/info.json') == '' }}
        run: cd scripts && python build_mask.py

      - name: Hämta vind, väder och vattentemperatur
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USER }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
          LM_USERNAME: ${{ secrets.LM_USERNAME }}
          LM_PASSWORD: ${{ secrets.LM_PASSWORD }}
        run: cd scripts && python update_data.py

      - name: Spara i förrådet
        run: |
          git config user.name "kartan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data mask
          git diff --cached --quiet || git commit -m "Ny data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
