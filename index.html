<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5F82">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skärgårdskartan">
<title>Skärgårdskartan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div id="map" aria-label="Karta"></div>

<header class="bar">
  <div class="row">
    <button class="btn" id="prev" aria-label="Bakåt i tiden">‹</button>
    <div class="when" id="when" aria-live="polite">Laddar …</div>
    <button class="btn" id="next" aria-label="Framåt i tiden">›</button>
    <button class="btn" id="play" aria-label="Spela upp prognosen">▶</button>
    <button class="btn" id="now">Nu</button>
  </div>
  <input type="range" id="time" aria-label="Välj tid" min="0" max="0" value="0">
</header>

<section class="panel" id="panel">
  <div class="chips" role="group" aria-label="Skikt">
    <button class="chip" data-layer="names" aria-pressed="true">Namn</button>
    <button class="chip" data-layer="la" aria-pressed="true">Lä</button>
    <button class="chip" data-layer="waves" aria-pressed="true">Våghöjd</button>
    <button class="chip" data-layer="temp" aria-pressed="false">Vattentemp</button>
    <button class="chip" data-layer="depth" id="depthchip" aria-pressed="false">Djup</button>
    <button class="chip" data-layer="contours" id="contourchip" aria-pressed="true">Höjdkurvor</button>
    <button class="chip" data-layer="arrows" aria-pressed="true">Vindpilar</button>
    <button class="chip" data-layer="priv" id="privchip" aria-pressed="true">Brygga/hus 25 m</button>
    <button class="chip find" id="findbtn" aria-pressed="false">Hitta plats</button>
  </div>
  <div id="find" hidden>
    <div class="frow"><span>Högst</span>
      <div class="seg small" role="radiogroup" aria-label="Högsta sjögång">
        <button role="radio" data-maxk="0" aria-checked="true">Lä</button>
        <button role="radio" data-maxk="1" aria-checked="false">Krusning</button>
        <button role="radio" data-maxk="2" aria-checked="false">Måttlig</button>
        <button role="radio" data-maxk="4" aria-checked="false">Valfri</button>
      </div></div>
    <label class="sl">Vattentemp från <b id="tminv"></b><input type="range" id="tmin" min="0" max="24" step="1"></label>
    <label class="sl">till <b id="tmaxv"></b><input type="range" id="tmax" min="0" max="24" step="1"></label>
    <div id="depthfind">
      <label class="sl">Djup från <b id="dminv"></b><input type="range" id="dmin" min="0" max="60" step="1" value="0"></label>
      <label class="sl">till <b id="dmaxv"></b><input type="range" id="dmax" min="0" max="60" step="1" value="60"></label>
    </div>
  </div>
  <div class="frow"><span>Sjögång</span>
    <div class="seg small" role="radiogroup" aria-label="Hur sjögången visas">
      <button role="radio" data-wstyle="farg" aria-checked="true">Färg</button>
      <button role="radio" data-wstyle="monster" aria-checked="false">Vågmönster</button>
      <button role="radio" data-wstyle="rorlig" aria-checked="false">Rörliga vågor</button>
    </div></div>
  <div class="frow"><span>Land</span>
    <div class="seg small" role="radiogroup" aria-label="Färg på land">
      <button role="radio" data-land="gul" aria-checked="true">Gult</button>
      <button role="radio" data-land="vit" aria-checked="false">Vitt</button>
      <button role="radio" data-land="detalj" aria-checked="false">Detalj</button>
      <button role="radio" data-land="karta" aria-checked="false">Karta</button>
    </div></div>
  <div class="frow" id="satrow" hidden><span>Satellit</span>
    <div class="seg small" role="radiogroup" aria-label="Satellitbild">
      <button role="radio" data-sat="" aria-checked="true">Av</button>
      <button role="radio" data-sat="grumlighet" aria-checked="false">Grumligt</button>
      <button role="radio" data-sat="alger" aria-checked="false">Alger</button>
    </div></div>
  <div class="frow"><span>Vind</span>
    <div class="seg small" role="radiogroup" aria-label="Vindkälla">
      <button role="radio" data-src="prognos" aria-checked="true">Prognos</button>
      <button role="radio" data-src="egen" aria-checked="false">Egen vind</button>
    </div></div>
  <div class="frow"><span>Räkna på</span>
    <div class="seg small" role="radiogroup" aria-label="Vind som vågorna räknas på">
      <button role="radio" data-basis="byar" aria-checked="true">Byar</button>
      <button role="radio" data-basis="medel" aria-checked="false">Medelvind</button>
    </div></div>
  <div id="own" hidden>
    <div class="dirs" id="dirs"></div>
    <label class="sl">Styrka <b id="spv">8 m/s</b><input type="range" id="sp" min="1" max="20" value="8"></label>
  </div>
  <div class="legend" id="legend"></div>
  <button class="linkbtn" id="explain">Vad betyder färgerna?</button>
  <button class="linkbtn" id="owndepth">Eget djup</button>
</section>

<div class="side">
  <button class="btn round" id="loc" aria-label="Visa min position">◎</button>
  <button class="btn round" id="hide" aria-label="Dölj eller visa panelen">☰</button>
</div>

<section class="sheet" id="sheet" role="dialog" aria-label="Vald plats">
  <button class="btn x" id="close" aria-label="Stäng">✕</button>
  <div id="sheetc"></div>
</section>
<div class="toast" id="toast" role="status"></div>
<script src="js/grund.js"></script>
<script src="js/rita.js"></script>
<script src="js/relief.js"></script>
<script src="js/lager.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
